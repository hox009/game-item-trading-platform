apiVersion: v1
kind: Namespace
metadata:
  name: gametrade
---
# Shared infra endpoints. Point these at in-cluster services or managed endpoints.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: gametrade
data:
  NACOS_ADDR: "nacos:8848"
  MYSQL_HOST: "mysql"
  REDIS_HOST: "redis"
  KAFKA_SERVERS: "kafka:9092"
  RABBITMQ_HOST: "rabbitmq"
