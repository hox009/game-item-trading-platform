apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant-service
  namespace: gametrade
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-assistant-service }
  template:
    metadata:
      labels: { app: ai-assistant-service }
    spec:
      containers:
        - name: ai-assistant-service
          image: gametrade/ai-assistant-service:latest
          ports: [{ containerPort: 8087 }]
          env:
            - name: GATEWAY_URL
              value: "http://gateway:80"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8087 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant-service
  namespace: gametrade
spec:
  selector: { app: ai-assistant-service }
  ports: [{ port: 8087, targetPort: 8087 }]
