# Backend microservices. Each is a Deployment (2 replicas for horizontal
# scaling / K8s load balancing) plus an internal ClusterIP Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: gametrade
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: gametrade/user-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: platform-config } }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: gametrade
spec:
  selector: { app: user-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
