server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # AI assistant service (more specific prefix first).
    location /api/assistant/ {
        proxy_pass http://ai-assistant-service:8087;
        proxy_set_header Host $host;
    }

    # All other business APIs go through the gateway.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
