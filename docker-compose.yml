# Local one-command stack for the Game Item Trading Platform.
#   docker compose up -d --build
#
# Brings up infrastructure (Nacos, MySQL, Redis, Kafka, RabbitMQ) and all
# microservices. Build the Java jars first: `mvn -DskipTests package`.

services:
  # ---------------- Infrastructure ----------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # ---------------- Observability ----------------
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---------------- Microservices ----------------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      NACOS_ADDR: nacos:8848
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy

  item-service:
    build:
      context: .
      dockerfile: item-service/Dockerfile
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      KAFKA_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      RABBITMQ_HOST: rabbitmq
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  ai-assistant-service:
    build: ./ai-assistant-service
    environment:
      GATEWAY_URL: http://gateway:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8087:8087"
    depends_on:
      - gateway

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - gateway
      - ai-assistant-service
